{% extends 'Abase.html' %}
{% block content %}

<div class="cbody" style="position: relative;">
    <img src="/static/images/banner/english.jpg" alt="Error !!! picture" class="ca_img" style="width: 100%; height: auto;top: -100px;">

    <p style="position: absolute; background: #FD2A2A; font-size: 50px; font-family: 'Inter'; color: white; font-weight: 600; padding: 10px; left: 50%; transform: translateX(-50%); top:-100px;">
        Welcome to English For Today
    </p>   

    <ul class="chapter-list">
        <li><a href="{% url 'e4ch1' %}">Unit-1</a></li>
        <li><a href="{% url 'e4ch2' %}">Unit-2</a></li>
        <li><a href="{% url 'e4ch3' %}">Unit-3</a></li>
        <li><a href="{% url 'e4ch4' %}">Unit-4</a></li>
        <li><a href="{% url 'e4ch5' %}">Unit-5</a></li>
        <li><a href="{% url 'e4ch6' %}">Unit-6</a></li>
        <li><a href="{% url 'e4ch7' %}">Unit-7</a></li>
        <li><a href="{% url 'e4ch8' %}">Unit-8</a></li>
        <li><a href="{% url 'e4ch9' %}">Unit-9</a></li>
    </ul>
</div>

<style>
.cbody {
    position: relative;
}

ul.chapter-list {
    position: absolute;
    top: 40px;        
    left: 25%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(2, 1fr); 
    gap: 15px; 
    list-style: none;
    padding: 0;
    margin: 0;
}

ul.chapter-list li {
    width: 250px; 
    height: 84px;
    background: #964BBA;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    border-radius: 5px;
}

ul.chapter-list li a {
    text-decoration: none;
    color: white;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
</style>

{% endblock %}
